<!doctype html>
<html>
    <head>
        <script src="../dist/index.umd.cjs"></script>
        <!-- docx/shapes: load it after docx. It adds the docxShapes global -->
        <script src="../dist/shapes.umd.cjs"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
    </head>

    <body>
        <h1>DOCX browser Word document generation</h1>

        <button type="button" onclick="generate()">Click to generate document</button>

        <script>
            function generate() {
                const doc = new docx.Document({
                    sections: [
                        {
                            children: [
                                new docx.Paragraph({
                                    children: [
                                        new docx.TextRun("Hello World"),
                                        new docx.TextRun({
                                            text: "Foo Bar",
                                            bold: true,
                                        }),
                                        new docx.TextRun({
                                            children: [new docx.Tab(), "Github is the best"],
                                            bold: true,
                                        }),
                                    ],
                                }),
                                new docx.Paragraph({
                                    children: [
                                        new docxShapes.ShapeRun({
                                            type: "roundedRectangle",
                                            text: "A shape",
                                            transformation: { width: "fitText", height: 40 },
                                            fill: "4472C4",
                                        }),
                                    ],
                                }),
                            ],
                        },
                    ],
                });

                docx.Packer.toBlob(doc).then((blob) => {
                    console.log(blob);
                    saveAs(blob, "example.docx");
                    console.log("Document created successfully");
                });
            }
        </script>
    </body>
</html>
