<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Calibri Light, Office's heading font, is drawn in Carlito, which is as tall as it and close to its widths -->
<fontconfig>
    <alias binding="same">
        <family>Calibri Light</family>
        <prefer>
            <family>Carlito</family>
        </prefer>
    </alias>
</fontconfig>
