name: Extract and Validate Document ⚙️
description: Extract the document and validate the XML against the schema.

runs:
    using: composite
    steps:
        - name: Extract Word Document
          shell: bash
          run: npm run extract
        - name: Validate XML
          uses: ChristophWurst/xmllint-action@v1
          with:
              xml-file: build/extracted-doc/word/document.xml
              xml-schema-file: ooxml-schemas/microsoft/wml-2010.xsd
        - name: Validate Theme XML
          uses: ChristophWurst/xmllint-action@v1
          with:
              xml-file: build/extracted-doc/word/theme/theme1.xml
              xml-schema-file: ooxml-schemas/ISO-IEC29500-4_2016/dml-main.xsd
